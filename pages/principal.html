<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080e10" />
    <title>CarHub | Principal</title>
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="../styles/principal.css" />
    <script src="../scripts/main.js" defer></script>
  </head>
  <body data-page="principal">
    <div data-container="topbar"></div>
    <div data-container="sidebar"></div>
    <main>
      <h1 class="sr-only">Publicações da comunidade CarHub</h1>
      <form class="composer" id="composer">
        <img
          class="avatar"
          src="https://i.pravatar.cc/80?img=12"
          alt=""
        /><input
          id="post-text"
          aria-label="Texto da publicação"
          placeholder="O que você está pensando?"
          maxlength="500"
          required
        /><label class="icon-button upload" aria-label="Adicionar imagem"
          ><span data-icon="image"></span
          ><input type="file" id="post-image" accept="image/*" hidden /></label
        ><span class="composer-divider"></span
        ><button
          class="icon-button send"
          aria-label="Publicar"
          data-icon="send"
        ></button>
      </form>
      <p id="attachment" class="attachment" hidden></p>
      <section
        class="feed"
        id="feed"
        aria-label="Feed de publicações"
      ></section>
      <div id="feed-pagination" class="feed-pagination">
        <button id="load-more" type="button">Carregar mais publicações</button>
        <p id="feed-status" role="status" aria-live="polite"></p>
      </div>
      <p id="feed-end" class="feed-end" role="status" hidden></p>
      <p id="empty" hidden>Nenhuma publicação encontrada.</p>
    </main>
    <dialog id="info-dialog">
      <button class="dialog-close icon-button" aria-label="Fechar">×</button>
      <h2></h2>
      <p></p>
    </dialog>
    <div class="toast" role="status" hidden></div>
  </body>
</html>
