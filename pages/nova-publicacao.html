<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080e10" />
    <title>CarHub | Nova publicação</title>
    <link rel="stylesheet" href="../styles/main.css?v=20261108-sidebar" />
    <link rel="stylesheet" href="../styles/nova-publicacao.css?v=20261108-sidebar" />
    <script src="../scripts/dados-eventos.js"></script>
    <script src="../scripts/main.js?v=20261108-sidebar" defer></script>
  </head>

  <body data-page="nova-publicacao">
    <div data-container="topbar"></div>
    <div data-container="sidebar"></div>
    <div data-container="chats"></div>

    <main class="nova-page">
      <section class="topo-nova">
        <h1>Nova publicação</h1>
        <div class="abas">
          <button type="button" class="aba ativa" id="aba-post">
            Foto/vídeo
          </button>
          <button type="button" class="aba" id="aba-evento">Novo evento</button>
        </div>
      </section>

      <div class="colunas">
        <section class="area-midia">
          <div class="icone-camera" aria-hidden="true" data-icon="camera"></div>
          <h2>Arraste suas fotos ou vídeos aqui</h2>
          <p>Suporta PNG, JPG e MP4 (Até 10 arquivos)</p>
          <button type="button" class="btn-escuro" id="btn-arquivo">
            Selecionar arquivo
          </button>
        </section>

        <section class="painel-form">
          <div class="usuario">
            <div class="avatar-nova" aria-hidden="true" data-icon="user"></div>
            <div>
              <strong>seu.usuario</strong>
              <p>Publicando no CarHub</p>
            </div>
          </div>

          <form id="form-post">
            <label for="legenda" class="sr-only">Legenda</label>
            <input
              type="text"
              id="legenda"
              class="campo-legenda"
              maxlength="200"
              required
              placeholder="Escreva uma legenda... Use #hashtags para categorizar"
            />

            <label for="veiculo">Qual seu veículo?</label>
            <input
              type="text"
              id="veiculo"
              list="lista-veiculos"
              placeholder="Selecione um carro (ex: Nissan Skyline R34)"
            />
            <datalist id="lista-veiculos">
              <option value="Nissan Skyline R34"></option>
              <option value="Volkswagen Fusca"></option>
              <option value="Chevrolet Opala"></option>
              <option value="Ford Maverick"></option>
              <option value="Honda Civic"></option>
            </datalist>

            <label for="local">Adicione sua localização</label>
            <input
              type="text"
              id="local"
              placeholder="Pesquisar local ou autódromo..."
            />

            <label for="marca">Marcar preparadora ou peças (opcional)</label>
            <input
              type="text"
              id="marca"
              placeholder="Marcar @oficina ou marca de peça"
            />

            <button type="submit" class="btn-laranja">Publicar agora</button>
          </form>

          <form id="form-evento" hidden>
            <label for="ev-titulo">Nome do evento</label>
            <input
              type="text"
              id="ev-titulo"
              maxlength="60"
              required
              placeholder="Ex: Classic Muscle Meeting"
            />

            <label for="ev-data">Data</label>
            <input type="date" id="ev-data" required />

            <label for="ev-hora">Horário</label>
            <input type="time" id="ev-hora" />

            <label for="ev-local">Local</label>
            <input
              type="text"
              id="ev-local"
              required
              placeholder="Ex: Parque do Imigrante"
            />

            <label for="ev-cidade">Cidade</label>
            <input
              type="text"
              id="ev-cidade"
              required
              placeholder="Ex: Caxias do Sul"
            />

            <fieldset>
              <legend>Tipo de evento</legend>
              <label
                ><input type="radio" name="tipo" value="Exposição" required />
                Exposição</label
              >
              <label
                ><input type="radio" name="tipo" value="Track Day" /> Track
                Day</label
              >
              <label
                ><input type="radio" name="tipo" value="Arrancada" />
                Arrancada</label
              >
              <label
                ><input type="radio" name="tipo" value="Drift" /> Drift</label
              >
            </fieldset>

            <button type="submit" class="btn-laranja">Publicar evento</button>
          </form>
        </section>
      </div>

      <section class="minhas-posts">
        <h2>Suas publicações</h2>
        <p id="sem-posts">Você ainda não publicou nada.</p>
        <ul id="lista-posts"></ul>
      </section>
    </main>

    <div data-container="footer"></div>
    <dialog id="info-dialog">
      <button class="dialog-close icon-button" aria-label="Fechar">×</button>
      <h2></h2>
      <p></p>
    </dialog>
    <div class="toast" role="status" hidden></div>
  </body>
</html>
