<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080e10" />
    <title>CarHub | Perfil</title>
    <link rel="stylesheet" href="../styles/main.css?v=20261109-gear" />
    <link
      rel="stylesheet"
      href="../styles/perfil.css?v=20261109-gear"
    />
    <script src="../scripts/main.js?v=20261109-gear" defer></script>
  </head>
  <body data-page="perfil">
    <div data-container="topbar"></div>
    <div data-container="sidebar"></div>
    <div data-container="chats"></div>
    <main class="profile-page">
      <section class="profile-header" aria-label="Informações do perfil">
        <div class="profile-cover" aria-hidden="true"></div>
        <div class="profile-info">
          <img
            class="profile-avatar"
            data-user-avatar
            src="https://i.pravatar.cc/240?img=26"
            alt="Foto de perfil de Gabriela Faraon"
          />
          <div class="profile-identity">
            <h1 class="profile-name" data-user-name>Gabriela Faraon</h1>
            <p class="profile-meta">
              @gbfaraon •
              <span
                class="inline-icon"
                data-icon="pin"
                aria-hidden="true"
              ></span>
              Caxias do Sul, RS
            </p>
            <p class="profile-bio" data-user-bio>
              Fotografia automotiva, encontros e cobertura de trackdays
              <span
                class="inline-icon"
                data-icon="flag"
                aria-hidden="true"
              ></span>
            </p>
          </div>
          <div class="profile-actions">
            <button
              class="button button-secondary"
              type="button"
              id="edit-profile"
            >
              Editar perfil
            </button>
            <button class="button button-primary" type="button" id="new-photo">
              <span
                class="inline-icon"
                data-icon="plus"
                aria-hidden="true"
              ></span>
              Nova foto
            </button>
          </div>
        </div>
      </section>

      <ul class="profile-stats" aria-label="Números do perfil">
        <li><strong data-stat="posts"></strong><span>Publicações</span></li>
        <li><strong data-stat="events"></strong><span>Eventos</span></li>
        <li><strong data-stat="followers"></strong><span>Seguidores</span></li>
        <li><strong data-stat="following"></strong><span>Seguindo</span></li>
      </ul>

      <div class="profile-tabs" role="tablist" aria-label="Conteúdo do perfil">
        <button
          class="tab"
          role="tab"
          id="tab-photos"
          data-tab="photos"
          aria-controls="tab-panel"
        >
          <span
            class="inline-icon"
            data-icon="camera"
            aria-hidden="true"
          ></span>
          Publicações (<span data-count="photos"></span>)
        </button>
        <button
          class="tab"
          role="tab"
          id="tab-events"
          data-tab="events"
          aria-controls="tab-panel"
        >
          <span
            class="inline-icon"
            data-icon="calendar"
            aria-hidden="true"
          ></span>
          Meus eventos (<span data-count="events"></span>)
        </button>
        <button
          class="tab"
          role="tab"
          id="tab-saved"
          data-tab="saved"
          aria-controls="tab-panel"
        >
          <span
            class="inline-icon"
            data-icon="bookmark"
            aria-hidden="true"
          ></span>
          Salvos
        </button>
      </div>
      <section id="tab-panel" role="tabpanel" tabindex="0"></section>
    </main>
    <div data-container="footer"></div>
    <dialog
      id="edit-profile-dialog"
      class="profile-editor"
      aria-labelledby="edit-profile-title"
    >
      <header class="profile-editor-header">
        <h2 id="edit-profile-title">Editar perfil</h2>
        <button
          type="button"
          class="icon-button"
          id="close-profile-editor"
          aria-label="Fechar edição do perfil"
          data-icon="close"
        ></button>
      </header>
      <form id="edit-profile-form">
        <div class="profile-editor-photo">
          <img
            id="profile-photo-preview"
            class="profile-editor-avatar"
            alt="Prévia da foto de perfil"
          />
          <div>
            <button
              type="button"
              class="button button-secondary"
              id="choose-profile-photo"
            >
              Alterar foto
            </button>
            <p>PNG, JPG ou WEBP · até 2 MB</p>
          </div>
          <input
            type="file"
            id="profile-photo-input"
            accept="image/png,image/jpeg,image/webp"
            hidden
          />
        </div>
        <label for="profile-description">Descrição do perfil</label>
        <textarea
          id="profile-description"
          rows="4"
          maxlength="240"
          placeholder="Conte um pouco sobre você e sua paixão por carros."
        ></textarea>
        <p id="profile-description-count" class="profile-editor-hint">
          0/240 caracteres
        </p>
        <p id="profile-editor-error" role="alert" hidden></p>
        <div class="profile-editor-actions">
          <button
            type="button"
            class="button button-secondary"
            id="cancel-profile-editor"
          >
            Cancelar</button
          ><button
            type="submit"
            class="button button-primary"
            id="save-profile-editor"
          >
            Salvar alterações
          </button>
        </div>
      </form>
    </dialog>
    <dialog id="info-dialog">
      <button class="dialog-close icon-button" aria-label="Fechar">×</button>
      <h2></h2>
      <p></p>
    </dialog>
    <div class="toast" role="status" hidden></div>
  </body>
</html>
