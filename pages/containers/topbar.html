<header class="topbar">
  <button
    class="menu-toggle icon-button"
    aria-label="Recolher menu"
    aria-expanded="true"
    data-icon="menu"
  ></button
  ><a class="brand" href="principal.html" aria-label="CarHub, página inicial"
    ><span class="brand-mark" data-icon="logo"></span
    ><span>CAR<strong>HUB</strong></span></a
  ><label class="search"
    ><span data-icon="search"></span
    ><input
      type="search"
      id="search"
      placeholder="Buscar carros, usuários, eventos..."
      aria-label="Buscar publicações"
  /></label>
  <div class="account">
    <button
      class="notification icon-button"
      aria-label="Notificações"
      data-icon="bell"
    ></button
    ><a
      class="account-link"
      href="perfil.html"
      data-page-link="perfil"
      aria-label="Abrir meu perfil"
      ><img class="avatar" src="https://i.pravatar.cc/80?img=12" alt="" /></a
    ><button
      class="icon-button profile-toggle"
      aria-label="Abrir opções do perfil"
      data-icon="chevron"
    ></button>
  </div>
</header>
